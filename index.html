<title>신상명 Q&amp;A 게시판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
<style>
/* 문제은행 사이트와 같은 결: 검은 내비 바, 왼쪽으로 기운 넓은 여백, 가는 선과 옅은 회색 면.
   질문·답변 본문만 시험지 명조. 라이트 단일 테마. */
:root{color-scheme:light;
 --paper:#fff;--soft:#f7f7f6;--soft-2:#f0f0ee;--ink:#1c1c1c;--muted:#888;--muted-2:#aaa;--line:#e9e9e9;--line-strong:#d5d5d5;
 --bar:#111;--bar-ink:#f6f6f6;--bar-muted:#bcbcbc;--bar-line:#2a2a2a;
 --mark:#c0384c;--mark-soft:#f9e9ec;--warn:#93600f;--warn-soft:#f6efe2;--ok:#3d7a62;--ok-soft:#eef6ef;
 --grad:linear-gradient(90deg,#b4a2e5 0%,#a6d4e3 32%,#86d3b1 64%,#4fbf8b 100%);
 --ui:Arial,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
 --exam:"Noto Serif KR","AppleMyungjo","Batang",serif;
 --gl:clamp(24px,5.7vw,96px);--gr:clamp(24px,7vw,140px)}
*{box-sizing:border-box;min-width:0}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--ui);-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #8b82c6;outline-offset:3px}
h1,h2,h3,h4{text-wrap:balance;margin:0;font-weight:400}
.gut{padding-left:var(--gl);padding-right:var(--gr)}
@media(max-width:700px){:root{--gl:20px;--gr:20px}}
.top{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--bar-ink);border-bottom:1px solid var(--bar-line);min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:14px;color:var(--bar-ink);text-decoration:none}
.brand b{font-size:29px;font-weight:500;letter-spacing:-1.7px;color:#fff}
.brand small{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--bar-muted)}
.tabs{display:flex;gap:clamp(16px,2vw,30px);overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs a{padding:10px 0;text-decoration:none;color:var(--bar-muted);white-space:nowrap;font-size:14.5px;border-bottom:1px solid transparent}
.tabs a:hover{color:#fff}
.tabs a[aria-current=page]{color:#fff;border-bottom-color:#fff}
.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:#fff;color:#111;font-size:11px;line-height:18px;text-align:center;vertical-align:2px}
@media(max-width:900px){.top{min-height:68px}.brand b{font-size:26px}.tabs{gap:22px;width:100%}}
.intro{padding-block:72px 52px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#8b8b8b}
.intro h2{font-size:clamp(46px,6.4vw,92px);line-height:1.02;letter-spacing:-.065em;margin:18px 0 0}
.accent-line{width:64px;height:2px;background:var(--grad);margin:26px 0 22px}
.intro p{margin:0;max-width:560px;color:#777;font-size:15px;line-height:2}
.stats{display:flex;flex-wrap:wrap;gap:12px 48px;margin-top:30px}
.stats b{display:block;font-size:34px;font-weight:400;letter-spacing:-.05em;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;letter-spacing:1.6px;color:#999}
@media(max-width:700px){.intro{padding-block:48px 34px}}
.banner{margin-top:22px;padding:14px 18px;background:var(--warn-soft);color:var(--warn);font-size:13px}
main{padding-block:44px 110px}
.btn{border:1px solid #dedede;background:#fff;border-radius:40px;padding:9px 18px;min-height:40px;white-space:nowrap;font-size:13px;color:#222;transition:background .2s,border-color .2s}
.btn:hover{background:#f3f3f3;border-color:#cfcfcf}
.btn.primary{background:#111;border-color:#111;color:#fff}.btn.primary:hover{background:#333}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}.btn.ghost:hover{color:var(--ink);background:var(--soft)}
.btn.danger{color:var(--mark);border-color:#e7b9c1}
.btn.ok{color:var(--ok);border-color:#bcd6c1}
.btn.sm{padding:5px 12px;min-height:32px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=text],input[type=search],input[type=tel],input[type=number],input[type=date],select,textarea{border:1px solid #e3e3e3;background:#fff;border-radius:0;padding:10px 12px;width:100%;font-size:16px;color:#222;letter-spacing:0}
input:focus,select:focus,textarea:focus{border-color:#111;outline:none}
input::placeholder,textarea::placeholder{color:#b3b3b3}
textarea{resize:vertical;line-height:1.7;min-height:130px}
.f{display:grid;gap:7px;font-size:10.5px;color:#999;letter-spacing:1.2px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid #dedede;background:transparent;border-radius:40px;padding:7px 14px;min-height:36px;color:#777;font-size:13px;letter-spacing:0}
.seg button:hover{border-color:#aaa;color:#111}
.seg button[aria-pressed=true]{background:#111;border-color:#111;color:#fff}
.tag{display:inline-flex;align-items:center;font-size:11px;padding:3px 10px;border-radius:30px;color:#888;border:1px solid #e2e2e0;white-space:nowrap}
.tag.subj{color:var(--ink);border-color:#cfcfcf}
.tag.wait{color:var(--mark);border-color:#e7b9c1;background:var(--mark-soft)}
.tag.done{color:var(--ok);border-color:#bcd6c1;background:var(--ok-soft)}
.tag.solved{color:#777;background:var(--soft-2);border-color:transparent}
.tag.pin{background:#111;color:#fff;border-color:#111}
.tag.t{background:#111;color:#fff;border-color:#111}
.panel{background:var(--soft);padding:clamp(22px,3vw,36px)}
.sectitle{font-size:10.5px;letter-spacing:1.6px;color:#999;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.empty{padding:64px 28px;background:var(--soft)}
.empty h2{font-size:clamp(26px,3.2vw,38px);letter-spacing:-.05em;margin-bottom:10px}
.empty p{color:#888;margin:0;line-height:1.9;max-width:520px}
.bank{display:grid;grid-template-columns:220px minmax(0,1fr);gap:clamp(28px,4vw,64px);align-items:start}
.side{position:sticky;top:100px;display:grid;gap:30px}
.tree{display:grid;border-top:1px solid var(--line)}
.tree button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 2px;color:#555;font-size:13px;transition:padding .2s,background .2s}
.tree button:hover{padding-left:8px;background:#fafafa;color:#111}
.tree button[aria-pressed=true]{color:#111;font-weight:600;padding-left:8px;box-shadow:inset 2px 0 0 #111}
.tree .n{font-variant-numeric:tabular-nums;color:var(--muted-2);font-size:12px;font-weight:400}
@media(max-width:860px){.bank{grid-template-columns:1fr}.side{position:static;gap:16px}.tree{display:flex;overflow-x:auto;border:0;gap:6px}.tree button{flex:none;border:1px solid #dedede;border-radius:40px;padding:7px 14px}.tree button:hover{padding-left:14px}.tree button[aria-pressed=true]{background:#111;color:#fff;box-shadow:none;padding-left:14px}.tree button[aria-pressed=true] .n{color:#ccc}}
.listbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:26px}
.listbar input[type=search]{flex:1 1 240px;width:auto;border:0;border-bottom:1px solid #222;padding:12px 2px;font-size:15px}
.listbar input[type=search]:focus{border-bottom-width:2px;padding-bottom:11px}
.qlist{display:grid;gap:18px}
.qcard{background:#fff;border:1px solid var(--line);transition:border-color .2s;display:block;width:100%;text-align:left;padding:0}
button.qcard:hover{border-color:#cfcfcf}
.qcard.pinned{border-color:#111;box-shadow:inset 3px 0 0 #111}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line)}
.qmeta .sp{flex:1}
.qmeta time,.qmeta .who{font-size:12px;color:var(--muted)}
.sheet{font-family:var(--exam);font-size:15px;line-height:1.85;color:#141414;padding:22px 26px}
.sheet h3{font-family:var(--exam);font-weight:600;font-size:17px;line-height:1.5;margin-bottom:6px;overflow-wrap:anywhere;word-break:keep-all}
.pv{margin:0;color:#555;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.qact{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;padding:12px 22px;border-top:1px solid var(--line);background:var(--soft);font-size:12.5px;color:#777}
.qact .sp{flex:1}
.detail h2{font-family:var(--exam);font-weight:600;font-size:clamp(21px,2.6vw,27px);letter-spacing:-.02em;line-height:1.45;margin-bottom:14px;overflow-wrap:anywhere;word-break:keep-all}
.body{white-space:pre-wrap;overflow-wrap:anywhere;word-break:keep-all;margin:0}
.imgs{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.imgs button{padding:0;border:1px solid var(--line);background:none}
.imgs img{display:block;width:150px;height:112px;object-fit:cover}
.answers{margin-top:40px}
.ans{border:1px solid var(--line);margin-top:14px}
.ans.t{border-color:#111}
.ans.t .qmeta{background:#111;color:#fff;border-color:#111}.ans.t .qmeta time{color:#bbb}
.ans .who{font-size:13px;color:inherit;font-weight:600}
.composer{margin-top:22px}
.files{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12px;color:#999}
.thumb{position:relative}.thumb img{width:70px;height:70px;object-fit:cover;border:1px solid var(--line);display:block}
.thumb button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:#111;color:#fff;font-size:13px;line-height:1}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:#555}
.chk input{width:18px;height:18px;accent-color:#111}
.err{color:var(--mark);font-size:13px;min-height:1em}
.ov{position:fixed;inset:0;z-index:20;background:#000a;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:5vh 14px}
.ov.on{display:flex}
.modal{background:#fff;width:min(680px,100%);padding:clamp(22px,3vw,38px)}
.modal h2{font-size:30px;letter-spacing:-.05em}
.lb img{max-width:100%;max-height:88vh;display:block;margin:auto}
table.mt{width:100%;border-collapse:collapse;font-size:13px}
.mt th,.mt td{border-bottom:1px solid var(--line);padding:11px 8px;text-align:left;vertical-align:middle}
.mt th{font-weight:500;color:#999;font-size:10.5px;letter-spacing:1px}
.mt td.c{white-space:nowrap;color:#888;font-variant-numeric:tabular-nums}
.reqs{display:grid;gap:14px}
.req{border:1px solid var(--line);background:#fff}
.req .sheet{font-family:var(--ui);font-size:14px;padding:16px 22px}
.req b{font-size:17px;font-weight:500;letter-spacing:-.03em}
.gate{max-width:640px}
.small{font-size:12.5px;color:#888;line-height:1.8}
@media(max-width:600px){.mt{font-size:13px}.stk thead{display:none}.stk tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stk td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7em}.stk td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-7em;color:#999;font-size:11px}.imgs img{width:104px;height:84px}}
.code{font:600 22px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;background:#fff;border:1px solid var(--line-strong);padding:14px 18px;display:inline-block}
.topr{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.who-top{font-size:12px;color:var(--bar-muted)}
.btn.bar{background:transparent;border-color:#444;color:#ddd}.btn.bar:hover{background:#222}
.gbtn{display:inline-flex;align-items:center;gap:10px}
.tag.priv{color:#5d3aa8;border-color:#cfc2ea;background:#f4f0fb}
.tag.ai{color:#1f5f9e;border-color:#bcd3ea;background:#eef4fb}
.draft{border:1px dashed #9db8d6;background:#f5f9fd;margin-top:22px}
.draft .qmeta{border-bottom:1px dashed #c5d6e8}
.draft .who{color:#1f5f9e!important}

/* ===== 디자인 다듬기 v2: 둥근 카드, 과목 색, 부드러운 그림자 ===== */
:root{--s0:#2f7f73;--s0-soft:#e8f3f0;--s1:#b2563d;--s1-soft:#f8ece7;--s2:#6a55c2;--s2-soft:#efecfa;--radius:16px}
body{background:#fafaf8}
.top{box-shadow:0 1px 0 #ffffff10}
.intro{position:relative;overflow:hidden;background:#fff}
.intro::after{content:"";position:absolute;right:-140px;top:-120px;width:560px;height:560px;border-radius:50%;background:radial-gradient(closest-side,#7fd1a84d,#a6d4e333 50%,#b4a2e51f 75%,transparent);pointer-events:none}
.intro::before{content:"";position:absolute;right:160px;bottom:-170px;width:420px;height:420px;border-radius:50%;background:radial-gradient(closest-side,#4fbf8b38,#86d3b11f 60%,transparent);pointer-events:none}
.intro>*{position:relative;z-index:1}
.stats{gap:12px}
.stats>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 20px 12px;min-width:118px;box-shadow:0 1px 2px #0000000a}
.stats b{font-size:30px}
.panel{border-radius:var(--radius)}
.empty{border-radius:var(--radius);text-align:left;position:relative;overflow:hidden}
.empty::after{content:"?";position:absolute;right:28px;top:50%;transform:translateY(-50%);font:600 120px/1 var(--exam);color:#0000000a}
input[type=text],input[type=search],input[type=tel],input[type=number],input[type=date],select,textarea{border-radius:12px}
input[type=date]{min-height:44px;color:#222;-webkit-appearance:none;appearance:none}
.listbar input[type=search]{border-radius:0}
.tag{font-weight:500}
.tag.subj{border-color:transparent}
.tag.subj.s0{color:var(--s0);background:var(--s0-soft)}
.tag.subj.s1{color:var(--s1);background:var(--s1-soft)}
.tag.subj.s2{color:var(--s2);background:var(--s2-soft)}
.qcard{border-radius:var(--radius);overflow:hidden;border-color:#ececea;box-shadow:0 1px 2px #0000000a;transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
button.qcard:hover{transform:translateY(-2px);box-shadow:0 12px 32px #0000000f;border-color:#e2e2e0}
.qcard.sc0{box-shadow:inset 4px 0 0 var(--s0),0 1px 2px #0000000a}.qcard.sc1{box-shadow:inset 4px 0 0 var(--s1),0 1px 2px #0000000a}.qcard.sc2{box-shadow:inset 4px 0 0 var(--s2),0 1px 2px #0000000a}
button.qcard.sc0:hover{box-shadow:inset 4px 0 0 var(--s0),0 12px 32px #0000000f}button.qcard.sc1:hover{box-shadow:inset 4px 0 0 var(--s1),0 12px 32px #0000000f}button.qcard.sc2:hover{box-shadow:inset 4px 0 0 var(--s2),0 12px 32px #0000000f}
.qcard.pinned{border-color:#111}
.qmeta{border-bottom:0;padding:16px 24px 0}
.sheet{padding:12px 26px 18px}
.qcard .sheet h3{font-size:18px}
.qact{background:transparent;border-top:1px solid #f0f0ee;padding:12px 24px}
.detail .qcard .qmeta{padding-top:20px}
.detail .qcard .sheet{padding:16px 28px 26px}
.imgs button{border-radius:12px;overflow:hidden}
.ans{border-radius:var(--radius);overflow:hidden;background:#fff;border-color:#ececea}
.ans.t{border-color:#e2e2e0;box-shadow:0 1px 2px #0000000a}
.ans.t::before{content:"";display:block;height:3px;background:var(--grad)}
.ans.t .qmeta{background:transparent;color:inherit;border:0}
.ans.t .who{display:inline-flex;align-items:center;gap:8px}
.ans.t .who::before{content:"T";display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#111;color:#fff;font:600 11px/1 var(--ui)}
.ans.t .qmeta time{color:var(--muted)}
.draft{border-radius:var(--radius);overflow:hidden}
.tree button[aria-pressed=true]{box-shadow:inset 2px 0 0 #111}
.tree button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px}
.modal{border-radius:22px;box-shadow:0 30px 80px #0000004d}
.ov{background:#0007;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.req,.mt{border-radius:var(--radius)}
.req{overflow:hidden}
.code{border-radius:12px;background:linear-gradient(#fff,#fff) padding-box,var(--grad) border-box;border:1.5px solid transparent}
@media(max-width:700px){
  .listbar [data-ask]{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 10px 28px #0000004d;padding:14px 22px;font-size:15px}
  .intro::after{width:360px;height:360px;right:-160px}
  .qmeta{padding:14px 18px 0}.sheet{padding:10px 18px 16px}.qact{padding:10px 18px}
}
@media(prefers-reduced-motion:reduce){button.qcard:hover{transform:none}}

/* ===== 상단 로고: 흰 바 + 검은 Q 마크 ===== */
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font:700 18px/1 var(--ui);position:relative}
.brand .bt{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.brand .bt b{font-size:21px;font-weight:700;letter-spacing:-.6px;color:inherit}
.brand .bt em{font-style:normal;font-size:21px;font-weight:400;letter-spacing:-.4px}
.brand small{font-size:12px;letter-spacing:0;text-transform:none;padding-left:12px;margin-left:2px;border-left:1px solid currentColor;line-height:1.2}
/* A: 흰 바 */
html[data-h=a] .top{background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);color:#111;border-bottom:1px solid #ececea;box-shadow:none}
html[data-h=a] .brand{color:#111}
html[data-h=a] .brand .mark{background:#111;color:#fff}
html[data-h=a] .brand .mark::after{content:"";position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--grad);border:2px solid #fff}
html[data-h=a] .brand .bt em{color:#8a8a8a}
html[data-h=a] .brand small{color:#9a9a9a;border-color:#e0e0de}
html[data-h=a] .tabs a{color:#888}html[data-h=a] .tabs a:hover{color:#111}
html[data-h=a] .tabs a[aria-current=page]{color:#111;border-bottom-color:#111}
html[data-h=a] .tabs .badge{background:#111;color:#fff}
html[data-h=a] .who-top{color:#999}
html[data-h=a] .btn.bar{border-color:#dedede;color:#555}html[data-h=a] .btn.bar:hover{background:#f3f3f3}
@media(max-width:600px){.brand small{display:none}.brand .bt b,.brand .bt em{font-size:19px}}

/* 학생 관리 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chips button{border:1px solid #e3e3e3;background:#fff;border-radius:999px;padding:8px 14px;font-size:13.5px;color:#555;letter-spacing:0}
.chips button[aria-pressed=true]{background:#111;color:#fff;border-color:#111}
.chips .n{margin-left:6px;opacity:.6;font-size:12px}
.lnk{border:0;background:none;padding:0;font:inherit;font-weight:600;color:#111;text-decoration:underline;text-decoration-color:#ccc;text-underline-offset:3px;cursor:pointer}

<script type="module">
import { firebaseConfig, TEACHER_EMAIL, TEACHER_NAME } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, getDocs, query, where, orderBy, limit, serverTimestamp, increment, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ---------- 보안: 다른 사이트에 몰래 끼워 넣기(클릭재킹) 방지 ---------- */
if(window.top!==window.self){try{window.top.location.replace(window.self.location.href)}catch(_){document.documentElement.innerHTML=""}throw new Error("framed")}
const SUBJ=["고1 통합사회","고1 한국사","수능 통합사회"];
const KIND=["개념 질문","문제 풀이","공부법·시험","기타"];
const CLS=["학원","과외"];
const GRADE=["","1학년","2학년","3학년","졸업생(N수)"];
const subjFor=g=>g===1?[0,1]:(g===3||g===4)?[2]:[0,1,2];
const grpOf=g=>g===1?"고1 내신":(g===3||g===4)?"수능 대비":g===2?"고2":"";
const mySubj=()=>isTeacher?[0,1,2]:subjFor((myMember&&myMember.grade)|0);
const who=m=>[m.school,GRADE[m.grade|0]].filter(Boolean).join(" · ");
let SCHOOLS=null,schoolPick=null,schoolLoad=null;
function loadSchools(){if(SCHOOLS||schoolLoad)return schoolLoad;schoolLoad=(window.__SCHOOLS_TXT?Promise.resolve(window.__SCHOOLS_TXT):fetch("schools.txt").then(r=>r.ok?r.text():"")).then(t=>{SCHOOLS=[];for(const line of t.split("\n")){const i=line.indexOf(":");if(i<0)continue;const [sido,gu]=line.slice(0,i).split("/");for(const n of line.slice(i+1).split(",")){if(!n)continue;const full=n[0]==="!"?n.slice(1):n+"고등학교";SCHOOLS.push({n:full,b:n[0]==="!"?full:n,r:(sido+" "+(gu||"")).trim()})}}}).catch(()=>{SCHOOLS=[]});return schoolLoad}
function findSchools(q){q=q.replace(/\s+/g,"").replace(/(고등학교|고교|고)$/,"");if(!q||!SCHOOLS)return[];const e=[],a=[],b=[];for(const x of SCHOOLS){const k=x.b.replace(/\s+/g,"");if(k===q)e.push(x);else if(k.startsWith(q))a.push(x);else if(k.includes(q)||x.r.replace(/\s+/g,"").includes(q))b.push(x)}return [...e,...a,...b].slice(0,8)}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ms=t=>t&&typeof t.toMillis==="function"?t.toMillis():Date.now();

let app0,auth,db;
try{app0=initializeApp(firebaseConfig);auth=getAuth(app0);db=getFirestore(app0)}catch(e){}

let me=null,isTeacher=false,ready=false,qLoaded=false,busy=false;
let myBlocked=undefined,blockedList={},myMember=undefined,myReq=undefined,members={},reqs=[],qs=[],answers=[],entry=null,imgCache={};
let page="board",openId=null,armed=null;
let subs=[],qUnsub=null,ansUnsub=null,drafts={},qPub=[],qMine=[];
let students={},klasses={},prog=[],progUnsub=null,openSid=null;const sf={cls:"all",q:"",st:"on",fold:"all",k:"all"};
const f={subj:"all",st:"all",q:""};
const form={subj:0,kind:0,files:[],target:"q"};

const ago=t=>{const d=(Date.now()-ms(t))/1000;if(d<60)return"방금";if(d<3600)return Math.floor(d/60)+"분 전";if(d<86400)return Math.floor(d/3600)+"시간 전";if(d<604800)return Math.floor(d/86400)+"일 전";const x=new Date(ms(t));return (x.getMonth()+1)+"월 "+x.getDate()+"일"};
const day=t=>{const x=new Date(ms(t));return x.getFullYear()+"."+String(x.getMonth()+1).padStart(2,"0")+"."+String(x.getDate()).padStart(2,"0")};
const nameOf=(o)=>{let n=o.authorName||"학생";if(o.anon&&isTeacher&&members[o.authorId])n=members[o.authorId].name+" (익명)";if(me&&o.authorId===me.uid)n+=" (나)";return n};
const stOf=q=>q.solved?["solved","해결 완료"]:q.status==="answered"?["done","답변 완료"]:["wait","답변 대기"];
const intro=(eb,h,p,extra="")=>`<section class="intro gut"><div class="eyebrow">${eb}</div><h2>${h}</h2><div class="accent-line"></div><p>${p}</p>${extra}</section>`;
const imgs=ids=>(ids||[]).length?`<div class="imgs">${ids.map(i=>`<button data-img="${esc(i)}" aria-label="사진 크게 보기"><img data-iid="${esc(i)}" alt="첨부 사진"></button>`).join("")}</div>`:"";
const okData=s=>typeof s==="string"&&s.startsWith("data:image/jpeg;base64,");

/* ---------- 상태 판정 ---------- */
function gate(){
  if(!db)return"config";
  if(!ready)return"loading";
  if(!me)return"signin";
  if(isTeacher)return"teacher";
  if(myMember===undefined||myReq===undefined||myBlocked===undefined)return"loading";
  if(myBlocked||(myMember&&myMember.status==="banned"))return"banned";
  if(myMember&&myMember.status==="approved")return"approved";
  if(myMember&&myMember.status==="rejected"&&(!myReq||ms(myReq.at)<=ms(myMember.at)))return"rejected";
  return myReq?"pending":"none";
}
const inside=()=>{const g=gate();return g==="teacher"||g==="approved"};
const pendingReqs=()=>reqs.filter(r=>{const m=members[r.id];return !m||(m.status!=="approved"&&ms(r.at)>ms(m.at))});

/* ---------- 입장 화면 ---------- */
function gateView(g){
  if(g==="config")return intro("Setup","설정이 필요해요","firebase-config.js 에 Firebase 프로젝트 값을 넣어 주세요. 안내서(README)를 참고하세요.");
  if(g==="loading")return intro("Loading","불러오는 중","잠시만 기다려 주세요.");
  if(g==="signin")return intro("Members only","로그인해 주세요","신상명 선생님 수업 학생 전용 질문 게시판이에요. 구글 계정으로 로그인한 뒤, 입장 코드로 승인을 신청하세요.")+
    `<main class="gut"><div class="panel gate stack">${/KAKAOTALK|Instagram|FBAN|FBAV|NAVER|Line\/|DaumApps|everytimeApp/i.test(navigator.userAgent)?`<div class="banner" style="margin:0">지금은 앱 안의 브라우저로 열려 있어서 구글 로그인이 막혀요. 오른쪽 위 메뉴(⋮ 또는 공유)에서 <b>다른 브라우저로 열기</b>를 눌러 크롬이나 사파리에서 열어 주세요.</div>`:""}<div class="row"><button class="btn primary gbtn" data-login>Google 계정으로 로그인</button></div><div class="err" id="lerr"></div><p class="small" style="margin:0">로그인하면 이름·이메일이 선생님께만 전달돼요. 다른 학생에게는 보이지 않아요.</p></div></main>`;
  if(g==="banned")return intro("Restricted","이용이 제한됐어요","이 계정은 선생님이 게시판 이용을 제한했어요. 문의할 내용이 있으면 선생님께 직접 연락해 주세요.");
  if(g==="pending")return intro("Waiting","승인 기다리는 중",`<b style="color:#111">${esc(myReq.name)}</b> 학생의 입장 요청이 선생님께 전달됐어요. 승인되면 이 화면이 바로 게시판으로 바뀌어요.`,`<p class="small" style="margin-top:14px">${esc(CLS[myReq.cls|0])} · ${esc(who(myReq))} · ${esc(me.email||"")}</p>`);
  const rej=g==="rejected";
  return intro("Members only",rej?"승인되지 않았어요":"입장 승인 신청",rej?"선생님이 요청을 승인하지 않았어요. 정보를 확인해 다시 신청하거나 선생님께 직접 문의해 주세요.":"수업 시간에 받은 입장 코드를 넣어야 신청할 수 있어요. 선생님이 확인 후 승인해 드려요.")+
  `<main class="gut"><form class="panel stack gate" id="rf" autocomplete="off">
    <label class="f">입장 코드<input type="text" id="rcode" maxlength="40" required placeholder="선생님께 받은 코드" autocapitalize="characters" spellcheck="false"></label>
    <div class="f">수업<div class="seg" id="rc">${CLS.map((c,i)=>`<button type="button" data-rc="${i}" aria-pressed="false">${c}</button>`).join("")}</div></div>
    <div class="f">학교<div class="sbox"><input type="text" id="rs" maxlength="40" required placeholder="학교 이름 검색 (예: 한빛고)" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="slist"><div class="slist" id="slist" role="listbox" hidden></div></div><span class="hint" id="shint">전국 고등학교 2,401곳에서 찾아요. 목록에 없으면 그대로 입력해도 돼요.</span></div>
    <div class="f">학년<div class="seg" id="rg">${[1,2,3,4].map(g=>`<button type="button" data-rg="${g}" aria-pressed="false">${GRADE[g]}</button>`).join("")}</div></div>
    <label class="f">이름 (실명)<input type="text" id="rn" maxlength="20" required placeholder="홍길동"></label>
    <label class="f">학생 전화번호<input type="tel" id="rp" maxlength="20" required inputmode="tel" autocomplete="tel" placeholder="010-0000-0000"></label>
    <label class="f">학부모 전화번호<input type="tel" id="rpp" maxlength="20" required inputmode="tel" placeholder="010-0000-0000"></label>
    <div class="err" id="rerr"></div>
    <div class="row"><button class="btn primary" type="submit">승인 신청 보내기</button></div>
    <p class="small" style="margin:0">${esc(me.email||"")} 계정으로 신청해요. 보낸 정보는 선생님만 볼 수 있어요.</p>
  </form></main>`;
}

/* ---------- 게시판 ---------- */
function filtered(base){
  const k=f.q.trim().toLowerCase();
  const r=base.filter(q=>(f.subj==="all"||String(q.subject)===f.subj)&&(f.st==="all"||stOf(q)[0]===f.st)&&(!k||((q.title||"")+" "+(q.body||"")).toLowerCase().includes(k)));
  return [...r.filter(q=>q.pinned),...r.filter(q=>!q.pinned)];
}
function boardView(mode){
  const base=mode==="mine"?qs.filter(q=>q.authorId===me.uid):qs,wk=Date.now()-7*864e5;
  const cnt=fn=>base.filter(fn).length;
  const stats=`<div class="stats">${[[base.length,"전체 질문"],[cnt(q=>stOf(q)[0]==="wait"),"답변 대기"],[cnt(q=>ms(q.createdAt)>wk),"이번 주"]].map(([n,l])=>`<div><b>${n}</b><span>${l}</span></div>`).join("")}</div>`;
  const tree=(items,key)=>`<div class="tree">${items.map(([v,l,n])=>`<button data-${key}="${v}" aria-pressed="${f[key]===v}"><span>${key==="subj"&&v!=="all"?`<i class="dot" style="background:var(--s${v})"></i>`:""}${l}</span><span class="n">${n}</span></button>`).join("")}</div>`;
  const list=filtered(base);
  let body;
  if(!qLoaded)body=`<div class="empty"><h2>불러오는 중</h2></div>`;
  else if(!base.length)body=`<div class="empty"><h2>${mode==="mine"?"아직 올린 질문이 없어요":"아직 질문이 없어요"}</h2><p>${isTeacher?"학생들이 질문을 올리면 여기에 쌓여요.":"모르는 건 그날 바로 물어보세요. 사소한 질문도 환영이에요. 내 질문은 선생님만 볼 수 있어요."}</p></div>`;
  else if(!list.length)body=`<div class="empty"><h2>조건에 맞는 질문이 없어요</h2><p>과목이나 상태, 검색어를 바꿔 보세요.</p></div>`;
  else body=`<div class="qlist">${list.map(q=>{const[sc,sl]=stOf(q);return `<button class="qcard sc${q.subject|0}${q.pinned?" pinned":""}" data-open="${esc(q.id)}">
    <div class="qmeta">${q.pinned?'<span class="tag pin">고정</span>':""}<span class="tag subj s${q.subject|0}">${esc(SUBJ[q.subject|0])}</span><span class="tag">${esc(KIND[q.kind|0])}</span><span class="tag ${sc}">${sl}</span>${isTeacher&&drafts[q.id]&&sc==="wait"?'<span class="tag ai">Claude 초안 있음</span>':""}<span class="sp"></span><time>${ago(q.createdAt)}</time></div>
    <div class="sheet"><h3>${esc(q.title)}</h3><p class="pv">${esc(q.body)}</p></div>
    <div class="qact"><span>${esc(nameOf(q))}</span><span class="sp"></span><span>답변 ${q.answerCount|0}</span>${(q.imageIds||[]).length?`<span>사진 ${q.imageIds.length}</span>`:""}</div></button>`}).join("")}</div>`;
  return intro("Q&amp;A",isTeacher?"질문 게시판":"내 질문",isTeacher?"고1 내신 통합사회·한국사, 수능 통합사회":({"0,1":"고1 내신 통합사회·한국사","2":"수능 통합사회"}[mySubj().join()]||"고1 내신 통합사회·한국사, 수능 통합사회")+"<br>내 질문과 답변은 선생님과 나만 볼 수 있어요.",stats)+
  `<main class="gut"><div class="bank"><aside class="side">
    <div><div class="sectitle">과목</div>${tree([["all","전체",base.length],...(isTeacher?[0,1,2]:mySubj()).map(i=>[String(i),SUBJ[i],cnt(q=>q.subject===i)])],"subj")}</div>
    <div><div class="sectitle">상태</div>${tree([["all","모든 질문",base.length],["wait","답변 대기",cnt(q=>stOf(q)[0]==="wait")],["done","답변 완료",cnt(q=>stOf(q)[0]==="done")],["solved","해결 완료",cnt(q=>stOf(q)[0]==="solved")]],"st")}</div>
  </aside><div><div class="listbar"><input type="search" id="q" placeholder="제목·내용 검색 (예: 시장 실패, 흥선 대원군)" aria-label="검색" value="${esc(f.q)}">${isTeacher?"":'<button class="btn primary" data-ask>질문하기</button>'}</div>${body}</div></div></main>`;
}

  </article>

    <div class="sheet"><p class="body">${esc(a.body)}</p>${imgs(a.imageIds)}</div>${isTeacher||a.authorId===me.uid?`<div class="qact"><span class="sp"></span>${del("a:"+esc(a.id))}</div>`:""}</div>`).join(""):`<div class="empty" style="padding:36px 28px"><p>${isTeacher?"아직 답변이 없어요. 아래에서 답변을 달아 주세요.":"선생님이 확인하면 여기에 답변이 달려요."}</p></div>`}
  ${isTeacher&&drafts[q.id]?`<div class="draft"><div class="qmeta"><span class="who">Claude 초안</span><span class="tag ai">검토 후 등록하세요</span><span class="sp"></span><time>${ago(drafts[q.id].at)}</time></div><div class="sheet"><p class="body">${esc(drafts[q.id].body)}</p></div><div class="qact"><button class="btn primary sm" data-usedraft>답변 칸에 넣고 고치기</button><span class="sp"></span><button class="btn ghost sm" data-deldraft>초안 지우기</button></div></div>`:""}
  <form class="panel stack composer" id="af"><label class="f">${isTeacher?"선생님 답변":"추가 질문 · 댓글"}<textarea id="ab" maxlength="4000" placeholder="${isTeacher?"핵심 개념 → 풀이 순서 → 비슷한 기출 포인트":"이해 안 되는 부분을 더 물어보거나, 고맙다는 말도 좋아요"}" required></textarea></label>
    <div class="files" id="afiles"></div><div class="err" id="aerr"></div><div class="row"><button class="btn primary" type="submit">${isTeacher?"답변 등록":"댓글 등록"}</button></div></form>
  </section></main>`;
}

/* ---------- 승인 관리 ---------- */

  const pend=pendingReqs(),all=Object.entries(members),approved=all.filter(([,m])=>m.status==="approved"),rej=all.filter(([,m])=>m.status==="rejected"),ban=all.filter(([,m])=>m.status==="banned"),gone=Object.entries(blockedList);

  <section><div class="sectitle">승인 대기</div>${pend.length?`<div class="reqs">${pend.map(r=>`<div class="req"><div class="qmeta"><span class="tag subj">${esc(CLS[r.cls|0])}</span>${members[r.id]?'<span class="tag wait">재신청</span>':""}<span class="sp"></span><time>${ago(r.at)}</time></div>
    <div class="sheet"><b>${esc(r.name)}</b> <span class="small">· ${esc(who(r))}${r.region?" ("+esc(r.region)+")":""}</span><p class="small" style="margin:4px 0 0">${esc(r.email)}${r.phone?" · 학생 "+esc(r.phone):""}${r.parent?" · 학부모 "+esc(r.parent):""}</p>${r.msg?`<p class="small" style="margin:6px 0 0;color:#555">“${esc(r.msg)}”</p>`:""}</div>
    <div class="qact"><button class="btn primary sm" data-approve="${esc(r.id)}">승인</button><button class="btn danger sm" data-reject="${esc(r.id)}">거절</button><span class="sp"></span>${banBtn(r.id)}</div></div>`).join("")}</div>`:`<div class="empty" style="padding:36px 28px"><p>새 입장 신청이 없어요.</p></div>`}</section>
  <section><div class="sectitle">승인된 학생 ${approved.length}</div>${approved.length?`<table class="mt stk"><thead><tr><th>이름</th><th>학교 · 학년</th><th>수업</th><th>이메일</th><th>승인일</th><th>질문</th><th></th></tr></thead><tbody>${approved.map(([id,m])=>`<tr><td data-l="이름">${esc(m.name)}</td><td data-l="학교·학년">${esc(who(m))}</td><td data-l="수업">${esc(CLS[m.cls|0])}</td><td data-l="이메일">${esc(m.email)}</td><td class="c" data-l="승인일">${day(m.at)}</td><td class="c" data-l="질문">${qn(id)}</td><td style="text-align:right">${armed==="x:"+id?`<button class="btn danger sm" data-revoke="${esc(id)}">정말 취소할까요?</button>`:`<button class="btn ghost sm" data-arm="x:${esc(id)}">승인 취소</button>`} ${banBtn(id)}</td></tr>`).join("")}</tbody></table>`:`<div class="empty" style="padding:36px 28px"><p>아직 승인한 학생이 없어요.</p></div>`}</section>
  ${rej.length?`<section><div class="sectitle">거절 · 취소 ${rej.length}</div><table class="mt stk"><thead><tr><th>이름</th><th>학교 · 학년</th><th>이메일</th><th>처리일</th><th></th></tr></thead><tbody>${rej.map(([id,m])=>`<tr><td data-l="이름">${esc(m.name)}</td><td data-l="학교·학년">${esc(who(m))}</td><td data-l="이메일">${esc(m.email)}</td><td class="c" data-l="처리일">${day(m.at)}</td><td style="text-align:right"><button class="btn ok sm" data-approve="${esc(id)}">다시 승인</button> ${banBtn(id)}</td></tr>`).join("")}</tbody></table></section>`:""}

    <div class="err" id="berr"></div>
    <p class="small" style="margin:10px 0 0">차단 해제하면 ‘거절·취소’로 옮겨지고 다시 승인할 수 있어요. 완전 삭제하면 그 사람의 질문·답변·사진·학생 관리 기록이 모두 지워지고 목록에서도 사라져요. 같은 구글 계정으로 다시 가입하는 것은 계속 막혀요.</p>
    ${gone.length?`<details class="gone"><summary>완전 삭제한 계정 ${gone.length}명 (재가입 차단 중)</summary><table class="mt stk"><tbody>${gone.map(([id,b])=>`<tr><td data-l="이름">${esc(b.name||"(이름 없음)")}</td><td data-l="이메일">${esc(b.email||"")}</td><td class="c" data-l="삭제일">${day(b.at)}</td><td style="text-align:right">${armed==="u:"+id?`<button class="btn sm" data-unblock="${esc(id)}">재가입을 허용할까요?</button>`:`<button class="btn ghost sm" data-arm="u:${esc(id)}">재가입 허용</button>`}</td></tr>`).join("")}</tbody></table></details>`:""}</section>
  </main>`;
}

/* ---------- 학생 관리 (선생님 전용) ---------- */
const pad2=n=>String(n).padStart(2,"0");
const ymOf=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1);
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())};
const won=n=>(Number(n)||0).toLocaleString("ko-KR")+"원";
const months=k=>{const d=new Date(),r=[];for(let i=0;i<k;i++){r.push(ymOf(new Date(d.getFullYear(),d.getMonth()-i,1)))}return r};
const ymLabel=ym=>{const[y,m]=ym.split("-");return y+"년 "+(+m)+"월"};
const dotDate=s=>s?s.replace(/-/g,"."):"";
const paidIn=(st,ym)=>!!(st&&st.pay&&st.pay[ym]&&st.pay[ym].date);
const shortSchool=n=>(n||"").replace(/고등학교$/,"고");
function sugFolder(xs){
  const d=new Date(),Y=d.getFullYear(),M=d.getMonth()+1;
  if(xs.length&&xs.every(x=>((x.m||x).grade|0)>=3))return `${M>=3?Y+1:Y}학년도 수능 통사`;
  const sch=[...new Set(xs.map(x=>shortSchool((x.m||x).school)))];
  const cl=[...new Set(xs.map(x=>(x.m||x).cls|0))];
  return `${M>=3?Y:Y-1} ${sch.length===1&&sch[0]?sch[0]:cl.length===1?CLS[cl[0]]:"학원"}`;
}
const allFolders=()=>[...new Set(Object.values(students).filter(x=>x.state==="done"&&x.folder).map(x=>x.folder))].sort((a,b)=>b.localeCompare(a,"ko"));
const folderList=id=>`<datalist id="${id}">${allFolders().map(f=>`<option value="${esc(f)}"></option>`).join("")}</datalist>`;
const pick=new Set();
const personOf=id=>{const m=members[id];if(m&&m.status==="approved")return m;const s=students[id];return s&&s.manual?{name:s.name||"학생",school:s.school||"",grade:s.grade|0,cls:s.cls|0,region:"",email:"",manual:true}:null};
const kList=()=>Object.entries(klasses).sort((a,b)=>(a[1].name||"").localeCompare(b[1].name||"","ko"));
const kTags=s=>(s.classes||[]).filter(k=>klasses[k]).map(k=>`<span class="tag kl k${klasses[k].subj??-1}">${esc(klasses[k].name)}</span>`).join(" ");
function klassBar(act){

  const cur=sf.k!=="all"&&klasses[sf.k];
  let form="";
  if(armed==="newk")form=`<form class="kform" id="kf" data-keep autocomplete="off"><input type="text" id="kname" maxlength="40" required placeholder="반 이름 (예: 2026 겨울 고1 통사 A반)"><select id="ksubj" aria-label="과목"><option value="-1">과목 공통</option>${SUBJ.map((x,i)=>`<option value="${i}">${x}</option>`).join("")}</select><button class="btn primary sm" type="submit">반 만들기</button><button class="btn ghost sm" type="button" data-arm="">취소</button></form>`;
  else if(armed==="addst")form=`<form class="kform add" id="nf" data-keep autocomplete="off"><input type="text" id="nname" maxlength="20" required placeholder="이름"><input type="text" id="nschool" maxlength="40" placeholder="학교 (예: 한빛고등학교)"><select id="ngrade" aria-label="학년">${[1,2,3,4].map(g=>`<option value="${g}">${GRADE[g]}</option>`).join("")}</select><select id="ncls" aria-label="수업">${CLS.map((c,i)=>`<option value="${i}">${c}</option>`).join("")}</select>${kList().length?`<select id="nk" aria-label="반"><option value="">반 없음</option>${kList().map(([id,k])=>`<option value="${esc(id)}" ${sf.k===id?"selected":""}>${esc(k.name)}</option>`).join("")}</select>`:""}<button class="btn primary sm" type="submit">학생 추가</button><button class="btn ghost sm" type="button" data-arm="">취소</button><p class="small" style="margin:0;flex-basis:100%">사이트에 가입하지 않은 학생(예: 과외만 하는 학생)도 진도·납부를 관리할 수 있어요. 게시판 질문은 가입해야 쓸 수 있어요.</p></form>`;

async function toJpeg(file){
  const b=await createImageBitmap(file);let side=1400,qual=.8,out="";
  for(let i=0;i<6;i++){
    const k=Math.min(1,side/Math.max(b.width,b.height)),c=document.createElement("canvas");
    c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0,c.width,c.height);
    out=c.toDataURL("image/jpeg",qual);if(out.length<880000)return out;side=Math.round(side*.8);qual=Math.max(.55,qual-.08);
  }
  return out.length<880000?out:null;
}

    try{for(const id of [...pick]){const cur=(students[id]||{}).classes||[];const nx=d.bkout!==undefined?cur.filter(x=>x!==kid):cur.includes(kid)?cur:[...cur,kid];await setDoc(doc(db,"students",id),{classes:nx,at:serverTimestamp()},{merge:true})}pick.clear();sf.k=kid;render()}catch(err){t.disabled=false}}
  else if(d.kdel!==undefined){const kid=sf.k;armed=null;if(!klasses[kid])return;t.disabled=true;
    try{for(const [id,st] of Object.entries(students))if((st.classes||[]).includes(kid))await setDoc(doc(db,"students",id),{classes:st.classes.filter(x=>x!==kid)},{merge:true});await deleteDoc(doc(db,"classes",kid));sf.k="all";render()}catch(err){t.disabled=false}}
  else if(d.sback!==undefined){location.hash="students"}
  else if(d.gs!==undefined){document.querySelectorAll("#gsubj button").forEach(b=>b.setAttribute("aria-pressed",b===t))}
  else if(d.psave||d.ptoday||d.pclear){
    const ym=d.psave||d.ptoday||d.pclear,sid=openSid,row=document.querySelector(`tr[data-row="${ym}"]`);if(!sid||!row||!/^\d{4}-\d{2}$/.test(ym))return;
    const fee=(students[sid]||{}).fee|0;let v;armed=null;
    if(d.pclear)v=deleteField();
    else{const amt=Math.max(0,Math.round(Number(row.querySelector(".pamt").value)||0)),date=d.ptoday?todayStr():row.querySelector(".pdate").value,memo=row.querySelector(".pmemo").value.trim().slice(0,60);
      v=(!amt&&!date&&!memo)?deleteField():{amt:amt||(d.ptoday?fee:0),date:/^\d{4}-\d{2}-\d{2}$/.test(date)?date:"",memo}}
    t.disabled=true;
    try{await setDoc(doc(db,"students",sid),{pay:{[ym]:v},at:serverTimestamp()},{merge:true});$("#perr").textContent="";document.activeElement&&document.activeElement.blur();render()}
    catch(err){t.disabled=false;errMsg(err,"#perr")}
  }
  else if(d.gdel){
    const sid=openSid,gid=d.gdel;armed=null;if(!sid)return;
    try{await deleteDoc(doc(db,"students",sid,"progress",gid));const rest=prog.filter(x=>x.id!==gid);
      await setDoc(doc(db,"students",sid),{last:rest[0]?{date:rest[0].date,subj:rest[0].subj|0,range:rest[0].range}:deleteField(),at:serverTimestamp()},{merge:true})}catch(err){render()}
  }
  else if(d.arm!==undefined){armed=d.arm||null;render()}
  else if(d.newcode!==undefined)setCode(randCode());
  else if(d.setcode!==undefined)setCode(($("#mycode").value||"").trim().toUpperCase());
  else if(d.copy!==undefined){try{await navigator.clipboard.writeText(entry.code);t.textContent="복사됨"}catch(_){}}
  else if(d.purge){const id=d.purge;armed=null;t.disabled=true;$("#berr").textContent="지우는 중…";
    try{
      const m=members[id]||{},r=reqs.find(x=>x.id===id)||{};
      await setDoc(doc(db,"blocked",id),{name:m.name||r.name||"",email:m.email||r.email||"",at:serverTimestamp()});
      for(const q of qs.filter(x=>x.authorId===id)){
        const as=await getDocs(collection(db,"questions",q.id,"answers"));
        for(const a of as.docs){for(const i of a.data().imageIds||[])await deleteDoc(doc(db,"images",i)).catch(()=>{});await deleteDoc(a.ref)}
        for(const i of q.imageIds||[])await deleteDoc(doc(db,"images",i)).catch(()=>{});
        await deleteDoc(doc(db,"drafts",q.id)).catch(()=>{});await deleteDoc(doc(db,"questions",q.id));
      }
      const pg=await getDocs(collection(db,"students",id,"progress"));for(const g of pg.docs)await deleteDoc(g.ref);
      await deleteDoc(doc(db,"students",id)).catch(()=>{});await deleteDoc(doc(db,"requests",id)).catch(()=>{});await deleteDoc(doc(db,"members",id));
      $("#berr").textContent="";
    }catch(err){t.disabled=false;errMsg(err,"#berr")}}
  else if(d.unblock){const id=d.unblock;armed=null;try{await deleteDoc(doc(db,"blocked",id))}catch(err){render()}}
  else if(d.approve||d.reject||d.revoke||d.ban||d.unban){
    const id=d.approve||d.reject||d.revoke||d.ban||d.unban,r=reqs.find(x=>x.id===id)||{},old=members[id]||{};armed=null;t.disabled=true;
    try{await setDoc(doc(db,"members",id),{status:d.approve?"approved":d.ban?"banned":"rejected",name:r.name||old.name||"학생",school:r.school||old.school||"",grade:(r.grade??old.grade??0)|0,region:r.region||old.region||"",cls:(r.cls??old.cls??0)|0,email:r.email||old.email||"",at:serverTimestamp()});
      if(d.approve&&(r.phone||r.parent)){const st=students[id]||{};await setDoc(doc(db,"students",id),{phone:st.phone||r.phone||"",parent:st.parent||r.parent||"",at:serverTimestamp()},{merge:true})}}catch(err){t.disabled=false}
  }
  else if(d.del){
    const q=qs.find(x=>x.id===openId);armed=null;if(!q)return;
    try{
      if(d.del==="q"){await deleteDoc(doc(db,"questions",q.id));if(isTeacher)deleteDoc(doc(db,"drafts",q.id)).catch(()=>{});for(const i of q.imageIds||[])deleteDoc(doc(db,"images",i)).catch(()=>{});location.hash="board"}
      else{const aid=d.del.slice(2),a=answers.find(x=>x.id===aid);await deleteDoc(doc(db,"questions",q.id,"answers",aid));
        const up={answerCount:increment(-1)};if(isTeacher)up.status=answers.some(x=>x.id!==aid&&x.teacher)?"answered":"wait";
        await updateDoc(doc(db,"questions",q.id),up).catch(()=>{});for(const i of (a&&a.imageIds)||[])deleteDoc(doc(db,"images",i)).catch(()=>{})}
    }catch(err){render()}
  }
  else if(d.solve!==undefined||d.pin!==undefined){
    const q=qs.find(x=>x.id===openId);if(!q)return;
    try{await updateDoc(doc(db,"questions",q.id),d.solve!==undefined?{solved:!q.solved}:{pinned:!q.pinned})}catch(err){}
  }
});
$("#logout").addEventListener("click",()=>signOut(auth));

let lastAct=Date.now();["pointerdown","keydown","scroll","touchstart"].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now()},{passive:true}));
setInterval(()=>{if(isTeacher&&auth&&Date.now()-lastAct>2*3600e3){lastAct=Date.now();signOut(auth)}},60e3);
document.addEventListener("input",async e=>{if(e.target.id==="q"){f.q=e.target.value;render()}
  else if(e.target.id==="sq"){sf.q=e.target.value;render()}
  else if(e.target.id==="rs"){schoolPick=null;$("#shint").textContent="전국 고등학교 2,401곳에서 찾아요. 목록에 없으면 그대로 입력해도 돼요.";await loadSchools();const v=e.target.value,r=findSchools(v),L=$("#slist");window.__slast=r;
    L.innerHTML=r.map((x,i)=>`<button type="button" role="option" data-sp="${i}"><b>${esc(x.n)}</b><span>${esc(x.r)}</span></button>`).join("")+(v.trim()&&!r.length?`<div class="snone">검색 결과가 없어요. 그대로 입력하면 돼요.</div>`:"");
    L.hidden=!v.trim();e.target.setAttribute("aria-expanded",String(!L.hidden))}});
document.addEventListener("focusin",e=>{if(e.target.id==="rs")loadSchools()});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.pick){t.checked?pick.add(t.dataset.pick):pick.delete(t.dataset.pick);render()}
  else if(t.dataset.pickall!==undefined){document.querySelectorAll("[data-pick]").forEach(c=>t.checked?pick.add(c.dataset.pick):pick.delete(c.dataset.pick));render()}});
document.addEventListener("click",e=>{const L=$("#slist");if(L&&!e.target.closest(".sbox"))L.hidden=true},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
$("#pick").addEventListener("change",async e=>{
  const fl=[...e.target.files].slice(0,3-form.files.length);e.target.value="";
  for(const x of fl){if(!x.type.startsWith("image/"))continue;try{const v=await toJpeg(x);if(v)form.files.push(v)}catch(_){}}
  files(form.target==="q"?"#ffiles":"#afiles",form.target);
});
